
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿CUÁNTO VALE? - Comparador</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  text-align: center;
  padding: 30px 15px;
  margin: 0;
}

main {
  max-width: 650px;
  margin: auto;
  background: #1e293b;
  padding: 25px;
  border-radius: 15px;
}

h1 {
  color: #38bdf8;
  font-size: 34px;
}

input, select, button {
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border-radius: 8px;
  font-size: 16px;
}

input, select {
  border: 1px solid #64748b;
}

button {
  color: white;
  border: 0;
  cursor: pointer;
  font-weight: bold;
}

.consultar {
  background: #0ea5e9;
}

.wallapop {
  background: #13c1ac;
}

.milanuncios {
  background: #ff7b00;
}

#resultado {
  margin-top: 20px;
  line-height: 1.6;
}
</style>
</head>

<body>

<main>

<h1>¿CUÁNTO VALE?</h1>

<h2>Comparador de precios de segunda mano</h2>

<p>Introduce tu producto y búscalo en las principales plataformas.</p>

<input
  type="text"
  id="producto"
  placeholder="¿Qué producto quieres valorar?"
>

<input
  type="text"
  id="marca"
  placeholder="Marca y modelo"
>

<select id="estado">
  <option value="Muy buen estado">Muy buen estado</option>
  <option value="Buen estado">Buen estado</option>
  <option value="Usado">Usado</option>
  <option value="Para reparar">Para reparar</option>
</select>

<button type="button" class="consultar" onclick="consultar()">
  Consultar producto
</button>

<button type="button" class="wallapop" onclick="buscarWallapop()">
  BUSCAR EN WALLAPOP
</button>

<button type="button" class="milanuncios" onclick="buscarMilanuncios()">
  BUSCAR EN MILANUNCIOS
</button>

<div id="resultado"></div>

</main>

<script>

function obtenerBusqueda() {

  const producto = document.getElementById("producto").value.trim();
  const marca = document.getElementById("marca").value.trim();

  if (!producto) {
    alert("Escribe primero el producto que quieres buscar.");
    return null;
  }

  return (producto + " " + marca).trim();
}

function consultar() {

  const busqueda = obtenerBusqueda();

  if (!busqueda) return;

  const estado = document.getElementById("estado").value;

  document.getElementById("resultado").innerHTML =
    "<h3>Producto introducido</h3>" +
    "<p>" + busqueda + "</p>" +
    "<p>Estado: " + estado + "</p>" +
    "<p>Ahora puedes buscarlo en Wallapop o Milanuncios.</p>";
}

function buscarWallapop() {

  const busqueda = obtenerBusqueda();

  if (!busqueda) return;

  window.location.href =
    "https://es.wallapop.com/app/search?keywords=" +
    encodeURIComponent(busqueda);
}

function buscarMilanuncios() {

  const busqueda = obtenerBusqueda();

  if (!busqueda) return;

  window.location.href =
    "https://www.milanuncios.com/anuncios/" +
    encodeURIComponent(busqueda.replace(/\s+/g, "-")) +
    ".htm";
}

</script>

</body>
</html>
