
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿CUÁNTO VALE? - Comparador de segunda mano</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  text-align: center;
  padding: 25px 15px;
  margin: 0;
}

main {
  max-width: 650px;
  margin: auto;
  background: #1e293b;
  padding: 25px;
  border-radius: 16px;
}

h1 {
  color: #38bdf8;
  font-size: 34px;
}

p { line-height: 1.5; }

input, select, button {
  display: block;
  width: 100%;
  padding: 14px;
  margin: 12px 0;
  border-radius: 8px;
  font-size: 16px;
}

input, select {
  border: 1px solid #64748b;
  background: white;
  color: #111827;
}

button {
  border: none;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.consultar { background: #0ea5e9; }
.wallapop { background: #13a99a; }
.milanuncios { background: #f07800; }

#resultado {
  margin-top: 22px;
  padding: 18px;
  background: #334155;
  border-radius: 12px;
  display: none;
}

.precio {
  color: #38bdf8;
  font-size: 30px;
  font-weight: bold;
}

.nota {
  color: #cbd5e1;
  font-size: 13px;
}
</style>
</head>

<body>
<main>

<h1>¿CUÁNTO VALE?</h1>
<h2>Calcula el precio de tu producto</h2>
<p>Descubre cuánto podrías pedir por tus artículos de segunda mano.</p>

<input id="producto" type="text"
placeholder="Producto (ejemplo: teléfono móvil)">

<input id="marca" type="text"
placeholder="Marca y modelo (ejemplo: iPhone 13)">

<label for="precioOriginal">Precio aproximado cuando era nuevo (€)</label>
<input id="precioOriginal" type="number" min="1"
placeholder="Ejemplo: 800">

<select id="estado">
<option value="0.80">Como nuevo</option>
<option value="0.65" selected>Muy buen estado</option>
<option value="0.50">Buen estado</option>
<option value="0.35">Bastante usado</option>
<option value="0.20">Para reparar</option>
</select>

<button type="button" class="consultar" onclick="calcularPrecio()">
CALCULAR PRECIO ESTIMADO
</button>

<div id="resultado">
<h3>Tu precio estimado de venta</h3>
<div class="precio" id="precioEstimado"></div>
<p id="detalle"></p>
<p class="nota">
Estimación orientativa basada en el precio nuevo y el estado.
No representa una media de anuncios reales.
</p>
</div>

<button type="button" class="wallapop" onclick="buscarWallapop()">
BUSCAR PRODUCTOS EN WALLAPOP
</button>

<button type="button" class="milanuncios" onclick="buscarMilanuncios()">
BUSCAR PRODUCTOS EN MILANUNCIOS
</button>

</main>

<script>
function obtenerBusqueda() {
  const producto = document.getElementById("producto").value.trim();
  const marca = document.getElementById("marca").value.trim();

  if (!producto) {
    alert("Escribe primero el nombre del producto.");
    return null;
  }

  return (producto + " " + marca).trim();
}

function calcularPrecio() {
  const busqueda = obtenerBusqueda();
  if (!busqueda) return;

  const precioNuevo = Number(
    document.getElementById("precioOriginal").value
  );

  const porcentaje = Number(
    document.getElementById("estado").value
  );

  if (!precioNuevo || precioNuevo <= 0) {
    alert("Introduce el precio aproximado del producto cuando era nuevo.");
    return;
  }

  const estimacion = precioNuevo * porcentaje;
  const minimo = estimacion * 0.90;
  const maximo = estimacion * 1.10;

  document.getElementById("precioEstimado").textContent =
    estimacion.toFixed(2) + " €";

  document.getElementById("detalle").textContent =
    "Rango orientativo: " + minimo.toFixed(2) +
    " € – " + maximo.toFixed(2) + " €.";

  document.getElementById("resultado").style.display = "block";
}

function buscarWallapop() {
  const busqueda = obtenerBusqueda();
  if (!busqueda) return;

  window.location.href =
    "https://es.wallapop.com/app/search?keywords=" +
    encodeURIComponent(busqueda);
}

function buscarMilanuncios() {
  const busqueda = obtenerBusqueda();
  if (!busqueda) return;

  window.location.href =
    "https://www.milanuncios.com/anuncios/" +
    encodeURIComponent(busqueda.replace(/\s+/g, "-")) + ".htm";
}
</script>

</body>
</html>
